<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

<button id="themeToggleBtn" onclick="toggleTheme()">🌙</button>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Admin Panel</h3>

    <button onclick="showTab('dashboard')">Dashboard</button>

    <div class="group">Management</div>
    <button data-perm="READ_CUSTOMER" onclick="showTab('customers')">Customers</button>
    <button disabled>Admins</button>
    <button disabled>Managers</button>
    <button disabled>Cashiers</button>
    <button disabled>Field Officers</button>

    <div class="group">Advanced</div>
    <button disabled>Roles</button>
    <button disabled>Areas</button>

    <div class="bottom">
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Header -->
    <div id="profile"></div>

    <!-- Tabs -->
    <div id="dashboard" class="tab">
      <h2>Dashboard</h2>
      <p>📊 Dummy stats (customers, connections, officers)</p>
    </div>

    <div id="customers" class="tab hidden">
      <h2>Customer Management</h2>

      <div id="customerAccessMsg"></div>

      <div class="customers-container">
        <div id="customersList"></div>
        <div id="pagination"></div>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div id="customerModal" class="modal hidden"></div>

<script src="js/theme.js"></script>
<script src="js/permissions.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
