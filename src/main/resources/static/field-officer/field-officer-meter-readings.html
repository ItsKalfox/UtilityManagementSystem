<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Reading - Field Officer</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-header-container">
            <div class="sidebar-header">
                <h2>Field Officer</h2>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="field-officer-dashboard.html" class="nav-item">
                Dashboard
            </a>
            <a href="field-officer-meter-readings.html" class="nav-item active">
                Meter Readings
            </a>
        </nav>
        <div class="sidebar-footer-container">
            <div class="sidebar-footer">
                <button class="icon-btn" onclick="handleSettings()">
                    <img src="../images/settings-icon.svg" alt="settings">
                </button>
                <button class="icon-btn logout-btn" id="logoutBtn" onclick="handleLogout()">
                    <img src="../images/logout-icon.svg" alt="logout">
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="user-info">
                <div class="user-avatar">F</div>
                <div>
                    <div class="user-name">Field Officer</div>
                    <div class="user-email">fieldofficer@ums.com</div>
                </div>
            </div>
        </header>
        <div class="content-area" id="contentArea">
            <div class="management-container">
                <div class="management-header">
                    <div class="management-title">
                        <div>
                            <h2>Customers</h2>
                        </div>
                        <div class="management-title-right">
                            <button class="icon-btn" id="refreshBtn" onclick="refreshCustomers()">
                                <img src="../images/refresh-icon.svg" alt="refresh">
                            </button>
<!--                            <button class="btn btn-view" onclick="openMeterReadingModal()" id="addMeterReadingBtn"  style="">-->
<!--                                Add Meter Reading-->
<!--                            </button>-->
                        </div>
                    </div>

                    <div class="management-controls">
                        <div class="search-box">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search by Name, Email, NIC, Id, Branch...">
                        </div>

                        <select id="filterStatus" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>

                        <select id="sortBySelect" class="sort-select">
                            <option value="userId">Sort by ID</option>
                            <option value="createdAt">Sort by Created Date</option>
                            <option value="updatedAt">Sort by Updated Date</option>
                        </select>

                        <select id="sortOrderSelect" class="sort-select">
                            <option value="asc">Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                </div>


                <div class="records-container" id="recordsContainer">
                </div>

                </div>

                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="recordModal"></div>

<div id="confirmOverlay" class="modal-overlay confirm-overlay"></div>
<div id="confirmModal" class="modal modal-confirm"></div>

<script src="../js/common/theme.js"></script>
<script src="../js/field-officer/customer-management.js"></script>
</body>
</html>
