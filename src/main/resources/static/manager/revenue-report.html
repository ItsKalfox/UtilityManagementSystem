<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../images/ums-favicon.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="theme-toggle-container">
    <label class="theme-toggle">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>
</div>

<div class="toast" id="toast"></div>

<div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header-container">
            <div class="sidebar-header">
                <h2>Manager Panel</h2>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item" data-tab="dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Dashboard
            </a>
            <a href="revenue-report.html" class="nav-item active">
                <img src="../images/manager-icon.svg" class="nav-icon" alt="manager-icon">
                Revenue Reports
            </a>
            <a href="defaulters.html" class="nav-item">
                <img src="../images/manager-icon.svg" class="nav-icon" alt="manager-icon">
                Defaulters
            </a>
            <a href="usage.html" class="nav-item">
                <img src="../images/manager-icon.svg" class="nav-icon" alt="manager-icon">
                Usage Report
            </a>
        </nav>
        <div class="sidebar-footer-container">
            <div class="sidebar-footer">
                <button class="icon-btn" onclick="handleSettings()">
                    <img src="../images/settings-icon.svg" alt="settings">
                </button>
                <button class="icon-btn logout-btn" id="logoutBtn" onclick="handleLogout()">
                    <img src="../images/logout-icon.svg" alt="logout">
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">M</div>
                <div class="user-details">
                    <div class="user-name" id="fullName">Manager</div>
                    <div class="user-email" id="email">manager@ums.com</div>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <div class="content-area">

            <!-- PAGE TITLE -->
            <section class="stats-section">
                <h3 class="section-title">Revenue Reports</h3>

                <!-- FILTERS -->
                <div class="datetime-filters">
                    <div class="filter-group">
                        <label for="startDate">Start Date</label>
                        <input type="datetime-local" id="startDate">
                    </div>
                    <div class="filter-group">
                        <label for="endDate">End Date</label>
                        <input type="datetime-local" id="endDate">
                    </div>
                    <div class="filter-group">
                        <label for="utilityType">Utility Type</label>
                        <select id="utilityType" class="filter-select">
                            <option value="all">All</option>
                            <option value="ELECTRICITY">Electricity</option>
                            <option value="WATER">Water</option>
                            <option value="GAS">Gas</option>

                        </select>
                    </div>
                    <div class="filter-group">
                        <button class="btn btn-view" id="applyFilter">Apply</button>
                    </div>
                </div>

                <!-- INFO BOX -->
                <div class="info-box">
                    <h4>Total Revenue:</h4>
                    <p id="totalRevenue">Rs. 0</p>
                </div>

                <!-- TABLE -->
                <!-- TABLE HEADER -->
                <div class="record-item record-header">
                    <div>#</div>
                    <div>Customer</div>
                    <div>Utility</div>
                    <div>Amount</div>
                    <div>Status</div>
                </div>

                <!-- BACKEND DATA WILL COME HERE -->
                <div class="records-container" id="revenueRecords">
                    <!-- JS injects rows here -->
                </div>



            </section>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="recordModal"></div>

<div id="confirmOverlay" class="modal-overlay confirm-overlay"></div>
<div id="confirmModal" class="modal modal-confirm"></div>

<script src="../js/common/theme.js"></script>
<script src="../js/admin/utils.js"></script>
<script src="../js/manager/revenue-report.js"></script>
</body>
</html>
